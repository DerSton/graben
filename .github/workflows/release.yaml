name: Build & Release

on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write

env:
  BIN_NAME: graben

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        env:
          EXT: ${{ matrix.ext }}
        run: |
          mv "target/${{ matrix.target }}/release/${BIN_NAME}${EXT}" \
             "${BIN_NAME}-${{ matrix.target }}${EXT}"

      - name: Upload to Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXT: ${{ matrix.ext }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${BIN_NAME}-${{ matrix.target }}${EXT}" --clobber
